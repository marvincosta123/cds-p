name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt coverage
      - name: Checagem do projeto e das migrações
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Testes automatizados com cobertura
        run: |
          coverage run --branch --source=estoque manage.py test estoque -v 2
          coverage report --omit='estoque/tests.py,estoque/migrations/*'
