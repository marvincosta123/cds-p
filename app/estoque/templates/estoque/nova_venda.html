{% extends "estoque/base.html" %}{% block subtitle %}Nova venda{% endblock %}
{% block content %}<a class="link" href="{% url 'menu' %}">← Voltar ao menu</a>
<form method="post" novalidate>{% csrf_token %}
{% for campo in form %}<label for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}
{% for e in campo.errors %}<div class="msg err" role="alert">{{ e }}</div>{% endfor %}{% endfor %}
{% for e in form.non_field_errors %}<div class="msg err" role="alert">{{ e }}</div>{% endfor %}
<button class="btn primary" style="justify-content:center;margin-top:16px" type="submit">Salvar venda</button></form>{% endblock %}
